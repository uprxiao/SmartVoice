[package]
name = "svi-input-win"
version = "0.0.1"
edition = "2021"
description = "SmartVoiceInput Windows input helper (v0.0.2): foreground/UIPI checks, clipboard paste, UI Automation read-back, plus the technical-verification harness"
license = "MIT"
publish = false

[lib]
name = "svi_input_win"
path = "src/lib.rs"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[[bin]]
name = "smartvoiceinput-input"
path = "src/bin/helper.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Variant",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
