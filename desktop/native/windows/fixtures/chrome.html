<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>SVI Chrome feasibility fixture</title>
<style>body{font:20px sans-serif;padding:40px}input,textarea{display:block;width:650px;padding:12px;font:20px sans-serif}textarea{height:180px}</style>
<h1>SmartVoiceInput：Chrome 技术验证</h1>
<p>虚构文本。实际值与选区由 UI Automation 独立读回。</p>
<script>
const params = new URLSearchParams(location.search);
const kind = params.get('kind');
const field = document.createElement(kind === 'textarea' ? 'textarea' : 'input');
window.sviEvents={pastes:[],enters:0};
field.addEventListener('keydown',event=>{if(event.ctrlKey&&event.key.toLowerCase()==='v')window.sviEvents.pastes.push({ctrl:event.ctrlKey,shift:event.shiftKey,alt:event.altKey,meta:event.metaKey});if(event.key==='Enter')window.sviEvents.enters++;});
const empty = params.get('empty') === '1';
field.value = empty ? '' : 'BEGIN React END';
field.setAttribute('aria-label', 'SVI fictional probe field');
document.body.append(field);
addEventListener('load', () => { field.focus(); field.setSelectionRange(empty ? 0 : 6, empty ? 0 : 11); });
</script>
</html>
