# Copy to app.yaml and adjust. Secrets are never stored here:
#   SVI_DATABASE_URL, SVI_JWT_SECRET, SVI_IDEMPOTENCY_SECRET,
#   SVI_LLM_API_KEY, SVI_ASR_API_KEY
environment: development

server:
  host: 127.0.0.1
  port: 17863

database:
  url_env: SVI_DATABASE_URL
  pool_size: 5
  max_overflow: 5

auth:
  issuer: smartvoiceinput-dev
  audience: smartvoiceinput

security:
  cors_origins:
    - http://127.0.0.1:17864

audio:
  active_pcm_budget_bytes: 134217728

sessions:
  initial_max_active: 20
  admission_ceiling: 20

# ASR provider: mock | mlx_whisper | whisper_cpp
# mlx_whisper requires the `mac` extra and model_path point to a converted
# Whisper model directory.
asr:
  provider: mock
  model_id: mock-asr
  model_path: ""
  language: auto
  finish_timeout_ms: 10000
  execution_slots: 1

# LLM provider: mock | ollama | openai_compatible
# A public endpoint (DeepSeek, OpenAI-compatible gateway) is deployment
# configuration only; no server code changes are required.
llm:
  refine_protocol: ds_r2
  # 官方deepseek-flash配置须关闭思考；本地JSON分类可独立配置classification_llm。
  # thinking: disabled
  max_output_tokens: 8192
  provider: mock
  model_id: mock-llm
  base_url: ""
  api_key_env: SVI_LLM_API_KEY
  structured_output: json_object
  temperature: 0
  call_timeout_ms: 10000
  max_inflight: 4

pipeline:
  stop_to_result_budget_ms: 30000
  classification_budget_ms: 10000

statistics:
  timezone: Asia/Shanghai
