[project]
name = "smartvoiceinput-server"
version = "0.0.1"
description = "SmartVoiceInput local/remote dictation service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "pyjwt>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "tqdm>=4.67,<5",
  "python-multipart>=0.0.20,<1",
  "websockets>=14,<17",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "websockets>=14,<17",
  "anyio>=4,<5",
]
mac = ["mlx-whisper>=0.4.2,<0.5"]

[project.scripts]
svi = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--ignore=tests/legacy"
filterwarnings = ["ignore::DeprecationWarning"]
