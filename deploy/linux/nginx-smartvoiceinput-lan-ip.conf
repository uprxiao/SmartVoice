# LAN/VPN distribution entry; keep the existing centos91 virtual host intact.
# This default TLS host also handles clients connecting by IP without SNI.
server {
    listen 443 ssl http2 default_server;
    server_name 192.168.14.151;
    ssl_certificate /etc/ssl/smartvoiceinput/lan-ip-20261028-01/server-chain.crt;
    ssl_certificate_key /etc/ssl/smartvoiceinput/lan-ip-20261028-01/server.key;
    client_max_body_size 4m;

    location /ws/v1/ {
        proxy_pass http://127.0.0.1:17863;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 480s;
        proxy_send_timeout 480s;
    }
    location ~ ^/(api|health)/ {
        proxy_pass http://127.0.0.1:17863;
        proxy_read_timeout 60s;
    }
    location /admin/ {
        alias /opt/smartvoiceinput/admin/dist-ip-20261028-01/;
        try_files $uri $uri/ /admin/index.html;
    }
}
