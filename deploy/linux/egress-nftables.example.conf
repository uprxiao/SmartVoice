# WARNING (TC-V2-DEP-04, 2026-10-28): static IP sets break CDN-backed hosts.
# api.deepseek.com rotated to addresses outside a set resolved minutes earlier and
# the app lost DeepSeek. Prefer an SNI/domain-based egress proxy; use this only
# with a resolver-driven refresh and monitoring.
# Sample outbound allowlist (V2 §6.3 / §9: network layer + application layer).
# Resolve the allowlisted hosts at deploy time into the sets below; keep DNS to
# the configured resolver only. Everything else on 443 is dropped.
table inet svi_egress {
    set allowed_v4 { type ipv4_addr; flags interval; }   # *.maas.aliyuncs.com, api.deepseek.com
    set allowed_v6 { type ipv6_addr; flags interval; }   # IPv6 too: hosts here resolve AAAA first
    chain output {
        type filter hook output priority 0; policy accept;
        meta skuid "svi" tcp dport 443 ip daddr @allowed_v4 accept
        meta skuid "svi" tcp dport 443 ip6 daddr @allowed_v6 accept
        meta skuid "svi" tcp dport 443 drop
    }
}
