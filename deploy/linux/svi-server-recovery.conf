# Upgrade drop-in for an existing svi-server.service. Install only together with
# the ManagedServer watchdog/recovery implementation; no secrets belong here.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Type=notify
NotifyAccess=main
TimeoutStartSec=60
TimeoutStopSec=60
WatchdogSec=30
WatchdogSignal=SIGKILL
KillMode=control-group
SendSIGKILL=yes
Restart=on-failure
RestartSec=5
