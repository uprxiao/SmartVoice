# Sample Nginx site (TLS termination; HTTPS/WSS only). Replace server_name/cert paths.
server {
    listen 80;
    server_name voice.example.internal;
    return 301 https://$host$request_uri;   # no cleartext API/WS
}

server {
    listen 443 ssl http2;
    server_name voice.example.internal;
    ssl_certificate     /etc/ssl/smartvoiceinput/fullchain.pem;
    ssl_certificate_key /etc/ssl/smartvoiceinput/privkey.pem;
    client_max_body_size 4m;

    location /ws/v1/ {
        proxy_pass http://127.0.0.1:17863;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        # ≥ longest session (360 s) + 120 s (V2 design §9, TC-V2-DEP-03).
        proxy_read_timeout 480s;
        proxy_send_timeout 480s;
    }
    location ~ ^/(api|health)/ {
        proxy_pass http://127.0.0.1:17863;
        proxy_read_timeout 60s;
    }
    location /admin/ {
        alias /opt/smartvoiceinput/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }
}
