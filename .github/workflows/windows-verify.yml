name: Windows technical probes

# Called from the already-registered Build installers workflow on feature/0.0.2.
# This file need not be merged to main just to dispatch the verification branch.
on:
  workflow_call:
    inputs:
      expanded_ui:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-probes:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set isolated probe directories
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/svi-rust-target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SVI_PROBE_BUNDLE=$env:RUNNER_TEMP/svi-probe-bundle" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SVI_PROBE_EVIDENCE=$env:RUNNER_TEMP/svi-windows-evidence" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem desktop/native/windows/scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
            $parameters = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            foreach($parameter in $ast.ParamBlock.Parameters){$null=$parameters.Add($parameter.Name.VariablePath.UserPath)}
            foreach($assignment in $ast.FindAll({param($node) $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and $node.Left -is [System.Management.Automation.Language.VariableExpressionAst]},$true)){
              $parent=$assignment.Parent;$functionLocal=$false
              while($null -ne $parent -and $parent -ne $ast){if($parent -is [System.Management.Automation.Language.FunctionDefinitionAst]){$functionLocal=$true;break};$parent=$parent.Parent}
              if(-not $functionLocal -and $parameters.Contains($assignment.Left.VariablePath.UserPath)){throw "Root typed parameter reassigned: $($_.Name):$($assignment.Extent.StartLineNumber)"}
            }
          }
      - name: Restore Rust probe build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/svi-rust-target
          key: ${{ runner.os }}-svi-probe-${{ hashFiles('desktop/native/windows/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-svi-probe-${{ hashFiles('desktop/native/windows/Cargo.lock') }}-
      - name: Check Rust before unit tests
        id: native-build
        shell: pwsh
        run: |
          cargo fmt --manifest-path desktop/native/windows/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --all-targets --manifest-path desktop/native/windows/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --lib --manifest-path desktop/native/windows/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SVI_MODIFIER_POLICY_CHECKED=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          cargo build --locked --release --bins --manifest-path desktop/native/windows/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Same target/runtime flags as desktop/scripts/build-voice-helper.mjs.
          cargo build --locked --release --target x86_64-pc-windows-msvc --config 'target.x86_64-pc-windows-msvc.rustflags=["-C","target-feature=+crt-static"]' --manifest-path desktop/native/windows/Cargo.toml --bin smartvoiceinput-input
          exit $LASTEXITCODE
      - name: Save compiled probe dependencies
        if: always() && steps.native-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/svi-rust-target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install locked Electron tools
        working-directory: desktop
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build independent fixture with native extraResources
        working-directory: desktop
        shell: pwsh
        run: pnpm exec electron-builder --win --x64 --dir --config native/windows/fixtures/electron-builder.cjs --publish never
      - name: Freeze runtime and fictional inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:SVI_PROBE_EVIDENCE | Out-Null
          . ./desktop/native/windows/scripts/probe-files.ps1
          Write-NewJson @{ source_sha=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; phase='before-preflight'; planned=15; attempted=0 } "$env:SVI_PROBE_EVIDENCE/bootstrap.json"
          ./desktop/native/windows/scripts/prepare-probes.ps1 -EnvironmentFile "$env:SVI_PROBE_EVIDENCE/environment.json"
      - name: Run isolated medium-integrity probes
        id: probes
        shell: pwsh
        run: |
          ./desktop/native/windows/scripts/run-probes.ps1 -OutputDir "$env:SVI_PROBE_EVIDENCE/run" -FixtureExe $env:SVI_PROBE_FIXTURE -ChromeExe $env:SVI_PROBE_CHROME -CodeExe $env:SVI_PROBE_CODE
      - name: Preserve native results before independent product integration
        if: ${{ !cancelled() && steps.probes.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/svi-windows-evidence/run/product-cases.json
            ${{ runner.temp }}/svi-windows-evidence/run/product-own-restore.json
            ${{ runner.temp }}/svi-windows-evidence/run/product-owned-popup-preparation.json
            ${{ runner.temp }}/svi-windows-evidence/run/product-slow-uia.json
            ${{ runner.temp }}/svi-windows-evidence/run/summary.json
          if-no-files-found: warn
          retention-days: 1
      - name: Prepare the locked product Electron runtime
        id: product-runtime
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        working-directory: desktop
        run: node node_modules/electron/install.js
      - name: Typecheck product before tests
        id: product-typecheck
        if: ${{ !cancelled() && steps.product-runtime.outcome == 'success' }}
        working-directory: desktop
        run: pnpm typecheck
      - name: Test product
        id: product-test
        if: ${{ !cancelled() && steps.product-typecheck.outcome == 'success' }}
        working-directory: desktop
        run: pnpm test
      - name: Build the actual Windows installer
        id: product-build
        if: ${{ !cancelled() && steps.product-test.outcome == 'success' }}
        shell: pwsh
        run: node scripts/release/build.mjs --platform win --arch x64 --output-dir "$env:RUNNER_TEMP/SVI 产品 smoke"
      - name: Smoke actual product background launch and second instance
        id: product-smoke
        if: ${{ !cancelled() && steps.product-build.outcome == 'success' }}
        shell: pwsh
        run: ./desktop/native/windows/scripts/product-package-smoke.ps1 -PackageDir "$env:RUNNER_TEMP/SVI 产品 smoke" -EvidenceFile "$env:SVI_PROBE_EVIDENCE/product-package.json"
      - name: Verify actual install uninstall and reinstall
        id: product-install
        if: ${{ !cancelled() && steps.product-smoke.outcome == 'success' }}
        shell: pwsh
        run: ./desktop/native/windows/scripts/product-install-smoke.ps1 -PackageDir "$env:RUNNER_TEMP/SVI 产品 smoke" -EvidenceDir "$env:SVI_PROBE_EVIDENCE/installation"
      - name: Compare real microphone status with synthetic devices
        id: product-media
        if: ${{ !cancelled() && steps.product-install.outcome == 'success' }}
        shell: pwsh
        run: |
          $folder="$env:SVI_PROBE_EVIDENCE/synthetic-media"
          New-Item -ItemType Directory -Path $folder | Out-Null
          ./desktop/native/windows/scripts/product-package-smoke.ps1 -PackageDir "$env:RUNNER_TEMP/SVI 产品 smoke" -EvidenceFile "$folder/product-package.json" -SyntheticMedia
          . ./desktop/native/windows/scripts/probe-files.ps1
          $normal=(Get-Content -Raw "$env:SVI_PROBE_EVIDENCE/product-rpc.json" | ConvertFrom-Json).observations.initial.microphone
          $synthetic=(Get-Content -Raw "$folder/product-rpc.json" | ConvertFrom-Json).observations.initial.microphone
          Write-NewJson @{normal=$normal;synthetic_devices=$synthetic;main_os_permission_check_unchanged=$true;browser_prompt_simulated=$true;physical_microphone_verified=$false;audio_chain_status=$(if($synthetic.status -eq 'granted' -and -not $synthetic.error){'eligible_not_run'}else{'blocked'});scope='actual Main API comparison only; no product recording/audio/model pass'} "$folder/feasibility.json"
      - uses: astral-sh/setup-uv@v6
        if: ${{ !cancelled() && steps.product-media.outcome == 'success' }}
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && steps.product-media.outcome == 'success' }}
        with:
          python-version: '3.12'
      - name: Prepare locked real-service test runtime
        id: live-runtime
        if: ${{ !cancelled() && steps.product-media.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:UV_PROJECT_ENVIRONMENT="$env:RUNNER_TEMP/svi-live-python"
          uv sync --project server --frozen --extra dev
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          "SVI_LIVE_PYTHON=$env:RUNNER_TEMP/svi-live-python/Scripts/python.exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Push-Location admin
          try { pnpm install --frozen-lockfile; if($LASTEXITCODE -ne 0){throw 'Locked Admin dependencies failed'}; pnpm build; if($LASTEXITCODE -ne 0){throw 'Actual Admin build failed'} } finally { Pop-Location }
          # A separate development build uses the documented loopback address.
          # Frozen NSIS/installed resources above are already built and are not repackaged.
          $env:VITE_API_BASE_URL='http://127.0.0.1:17863'
          $env:VITE_SERVICE_CA_SHA256=''
          Push-Location desktop
          try { pnpm build; if($LASTEXITCODE -ne 0){throw 'Development Main/preload/renderer build failed'} } finally { Pop-Location }
      - name: Actual client real-service and Admin UI integration
        id: live-ui
        if: ${{ !cancelled() && steps.live-runtime.outcome == 'success' }}
        shell: pwsh
        env:
          SVI_EXPANDED_UI: ${{ inputs.expanded_ui }}
        run: ./desktop/native/windows/scripts/product-live-service.ps1 -PythonExe $env:SVI_LIVE_PYTHON -EvidenceDir "$env:SVI_PROBE_EVIDENCE/live-desktop" -HistoryInsert -ExpandedUI:($env:SVI_EXPANDED_UI -eq 'true')
      - name: Preserve the development installer
        if: ${{ success() && steps.probes.outcome == 'success' && steps.product-smoke.outcome == 'success' && steps.product-install.outcome == 'success' && steps.live-ui.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-v002-development-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/SVI 产品 smoke/SmartVoiceInput-*.exe
            ${{ runner.temp }}/SVI 产品 smoke/manifest-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve all results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-probes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/svi-windows-evidence/*.json
            ${{ runner.temp }}/svi-windows-evidence/run/*.json
            ${{ runner.temp }}/svi-windows-evidence/run/*.jsonl
            ${{ runner.temp }}/svi-windows-evidence/run/*.txt
            ${{ runner.temp }}/svi-windows-evidence/run/fixture-rpc/*.json
            ${{ runner.temp }}/svi-windows-evidence/run/fixture-rpc/*.png
            ${{ runner.temp }}/svi-windows-evidence/installation/**/*.json
            ${{ runner.temp }}/svi-windows-evidence/installation/*.json
            ${{ runner.temp }}/svi-windows-evidence/synthetic-media/*.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/summary.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/prepared.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/setup-failure.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/setup-acl.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/api-owner.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/runtime-owner.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/helper-identity.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/profile-lifecycle.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/crypto-control.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/desktop-register.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/desktop-resume.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/desktop-logout.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/desktop-controls.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/renderer-crash-preparation.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/desktop-crash-recovery.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/desktop-controls-restart.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/journal-*.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/admin-journal.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/screenshots/*.png
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/admin-ui.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/history-seed.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/history-seed-failure.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/history-targets.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/history-preparation-cleanup.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/desktop-history.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/admin-history.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/database-*.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/login-cleanup.json
            ${{ runner.temp }}/svi-windows-evidence/live-desktop/postgres-cleanup-*.json
          if-no-files-found: warn
          retention-days: 1
