name: Windows isolated credential controls

on:
  workflow_call:

permissions:
  contents: read

jobs:
  controls:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolate temporary controls
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/svi-rust-target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/svi-rust-target
          key: ${{ runner.os }}-svi-credential-${{ hashFiles('desktop/native/windows/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-svi-probe-${{ hashFiles('desktop/native/windows/Cargo.lock') }}-
      - name: Build the owned Medium launcher
        run: cargo build --locked --release --manifest-path desktop/native/windows/Cargo.toml --bin verify
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Prepare the locked real Electron runtime
        working-directory: desktop
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node node_modules/electron/install.js
          exit $LASTEXITCODE
      - name: Observe standalone public API controls
        shell: pwsh
        run: ./desktop/native/windows/scripts/credential-controls.ps1 -EvidenceDir "$env:RUNNER_TEMP/svi-credential-controls"
      - name: Preserve only anonymous observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-credentials-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/svi-credential-controls/plan.json
            ${{ runner.temp }}/svi-credential-controls/crypto-control.json
            ${{ runner.temp }}/svi-credential-controls/summary.json
          if-no-files-found: warn
          retention-days: 1
